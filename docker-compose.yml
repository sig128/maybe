# Local development services. The Solana validator runs natively (scripts/validator.sh);
# the API and worker run with `pnpm dev:local` or the services below.
services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: maybe
      POSTGRES_PASSWORD: maybe-local-dev
      POSTGRES_DB: maybe
    ports: ["127.0.0.1:5432:5432"]
    volumes: [maybe-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maybe"]
      interval: 2s
      retries: 30

  api:
    profiles: [app]
    image: node:22.22-bookworm
    working_dir: /repo/apps/server
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      MAYBE_MODE: localnet
      HOST: 0.0.0.0
      DATABASE_URL: postgres://maybe:maybe-local-dev@db:5432/maybe
      RPC_URL: http://host.docker.internal:8899
      WEB_ORIGIN: http://127.0.0.1:5173
      AUTH_DOMAIN: 127.0.0.1:5173
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [.:/repo]
    ports: ["127.0.0.1:8787:8787"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    profiles: [app]
    image: node:22.22-bookworm
    working_dir: /repo/apps/server
    command: ["node", "--import", "tsx", "src/worker.ts"]
    environment:
      MAYBE_MODE: localnet
      DATABASE_URL: postgres://maybe:maybe-local-dev@db:5432/maybe
      RPC_URL: http://host.docker.internal:8899
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [.:/repo]
    depends_on: { db: { condition: service_healthy } }

volumes:
  maybe-db:
